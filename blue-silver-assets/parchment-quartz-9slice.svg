      <stop offset=".16" stop-color="#fff2f2"/>
      <stop offset=".5" stop-color="#fff9f6"/>
      <stop offset=".84" stop-color="#fff2f2"/>
      <stop offset=".945" stop-color="#f2d2d5"/>
